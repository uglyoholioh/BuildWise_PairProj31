<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BuildWise{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">BuildWise</a>
      {% if user.is_authenticated %}
      {% if user.is_active and user.employee_profile.active %}
      <a class="nav-link text-light ms-3" href="{% url 'catalogue:component_list' %}">Components</a>
      {% endif %}
      <form class="ms-auto" method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
