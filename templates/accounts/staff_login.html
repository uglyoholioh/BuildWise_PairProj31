{% extends "base.html" %}

{% block title %}Staff sign in | BuildWise{% endblock %}

{% block content %}
<section class="mx-auto" style="max-width: 28rem;">
  <h1 class="h3 mb-3">Staff sign in</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-danger" role="alert">Username or password is incorrect.</div>
    {% endif %}
    <div class="mb-3">
      <label class="form-label" for="id_username">Username</label>
      <input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_password">Password</label>
      <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
